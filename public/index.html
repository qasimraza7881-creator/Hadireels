<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Hadi Reels</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one phone-width column. Full-bleed snap feed with bottom tab bar. Every secondary screen (menu, settings, studio, balance...) opens as a full-height page with a back arrow on top of the tabs. */
:root{--bg:#14101a;--surface:#1f1a28;--line:#322a3f;--fg:#f6f1f7;--mute:#a99bb8;--accent:#ff5c8a;--on-accent:#1a0a12;--ok:#5fd3a0;--bad:#ff6b6b;
--display:'Bricolage Grotesque',system-ui,sans-serif;--body:'DM Sans',system-ui,sans-serif;color-scheme:dark}
:root[data-app-theme="light"]{--bg:#fbf8fc;--surface:#f0eaf4;--line:#ddd3e6;--fg:#1c1423;--mute:#6f6080;--accent:#d92b65;--on-accent:#fff;--ok:#12805c;--bad:#c62828;color-scheme:light}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);overflow:hidden}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.calm *{animation:none!important;transition:none!important}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;max-width:480px;margin:0 auto;position:relative;overflow:hidden}
#shell{height:100%;display:flex;flex-direction:column}
.views{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain}
.tabbar{display:flex;border-top:1px solid var(--line);background:var(--bg)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;color:var(--mute);font-size:11px;font-weight:500;position:relative;min-width:0}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--fg)}
.tab.plus span.pill{background:var(--accent);color:var(--on-accent);border-radius:10px;width:44px;height:30px;display:grid;place-items:center;border:0;padding:0}
.dot{position:absolute;top:4px;left:calc(50% + 6px);background:var(--accent);color:var(--on-accent);font:700 10px var(--body);border-radius:99px;padding:1px 5px;font-style:normal}
svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
.mute{color:var(--mute)}
/* feed */
#feed{position:absolute;inset:0;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;background:#000}
.reel{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative;overflow:hidden;color:#fff}
.reel video{width:100%;height:100%;object-fit:cover;display:block;background:#000}
.sample{height:100%;display:flex;align-items:center;justify-content:center;padding:32px;text-align:center;position:relative}
.sample h2{font-size:30px;line-height:1.15;font-weight:800;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.tag{position:absolute;top:56px;left:16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.4);padding:3px 8px;border-radius:6px}
.shade{position:absolute;inset:auto 0 0 0;height:45%;background:linear-gradient(transparent,rgba(0,0,0,.7));pointer-events:none}
.info{position:absolute;left:0;right:76px;bottom:16px;display:flex;flex-direction:column;gap:6px}
.info p{margin:0;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.6);overflow-wrap:anywhere}
.snd-row{display:flex;gap:6px;align-items:center;font-size:13px}.snd-row svg{width:16px;height:16px}
.who{font-weight:700;font-size:16px;color:#fff;text-align:left;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;background:var(--accent);color:var(--on-accent);padding:1px 6px;border-radius:5px}
.badge.b2{background:#fff;color:#14101a}
.rail{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:16px;display:flex;flex-direction:column;gap:14px;align-items:center}
.rail>button{display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.rail svg{width:32px;height:32px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.rail .liked svg{fill:var(--accent);stroke:var(--accent)}
.rail .saved svg{fill:#ffc84d;stroke:#ffc84d}
.rav{position:relative;margin-bottom:10px}
.rav .ava{border:2px solid #fff}
.radd{position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--on-accent);font-weight:800;line-height:20px;text-align:center}
.snd,.srch{position:absolute;top:12px;z-index:3;background:rgba(0,0,0,.45);color:#fff;border-radius:50%;width:38px;height:38px;display:grid;place-items:center}
.snd{right:12px}.srch{left:12px}
.snd svg,.srch svg{width:20px;height:20px}
.ftabs{position:absolute;top:14px;left:0;right:0;z-index:2;display:flex;justify-content:center;gap:18px;pointer-events:none}
.ftabs button{pointer-events:auto;color:rgba(255,255,255,.65);font-weight:700;font-size:16px;text-shadow:0 1px 6px rgba(0,0,0,.6);padding:4px 2px;border-bottom:2px solid transparent}
.ftabs button.on{color:#fff;border-color:#fff}
.empty{padding-top:80px;text-align:center;color:var(--mute);background:var(--bg);height:100%}
/* sheets */
.sheet{position:absolute;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end}
.sheet>div{width:100%;max-height:78%;background:var(--surface);border-radius:18px 18px 0 0;display:flex;flex-direction:column;padding-top:14px}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px}
#clist,#s2b{overflow-y:auto;flex:1;min-height:80px}
.cm{padding:8px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;overflow-wrap:anywhere}
.cm button,.link{color:var(--mute);font-size:12px}
.row-form{display:flex;gap:8px;padding-top:10px;padding-bottom:12px}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:84px;resize:vertical}
.btn{background:var(--accent);color:var(--on-accent);font-weight:700;border-radius:10px;padding:11px 16px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.45;pointer-events:none}
/* pages */
#page{position:absolute;inset:0;z-index:15;background:var(--bg);display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line)}
.phead h3{flex:1;font-size:18px}
.phead button{width:32px;height:32px;display:grid;place-items:center}
.phead svg{width:24px;height:24px}
.pbody{flex:1;overflow-y:auto;padding-block:8px 28px;overscroll-behavior:contain}
.grp{color:var(--mute);font-size:13px;margin:18px 0 2px;font-weight:500}
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row .l{flex:1;min-width:0;overflow-wrap:anywhere}
.row small{display:block;color:var(--mute);font-size:12px;font-weight:400}
.row .v{color:var(--mute);font-size:14px;flex:none}
.row.chev::after{content:"\203A";color:var(--mute);font-size:22px;line-height:1}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none}
.radio.on{border-color:var(--accent);background:radial-gradient(var(--accent) 45%,transparent 50%)}
.note{background:var(--surface);border-radius:10px;padding:10px 12px;color:var(--mute);font-size:13px;margin-block:10px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:14px;padding:14px;min-width:0}
.card h3{font-size:16px;margin-bottom:8px}
.big{font:800 40px var(--display);font-variant-numeric:tabular-nums;line-height:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--surface);border-radius:12px;padding:10px;min-width:0}
.kpis b{display:block;font:800 22px var(--display);font-variant-numeric:tabular-nums}
.kpis span{font-size:11px;color:var(--mute)}
.bars{display:flex;gap:6px;align-items:flex-end;height:130px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;min-width:0}
.bars i{width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px;display:block}
.bars b{font-size:11px;font-variant-numeric:tabular-nums}.bars small{font-size:10px;color:var(--mute)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li .grow{flex:1;min-width:0}
.li .grow>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .grow>div.wrap{white-space:normal;overflow-wrap:anywhere}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pill{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.pill.ceo{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pill.admin{color:var(--ok);border-color:var(--ok)}
.pill.ban{color:var(--bad);border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px}
.seg{display:flex;background:var(--surface);border-radius:10px;padding:3px}
.seg button{flex:1;padding:8px;border-radius:8px;font-weight:700;color:var(--mute);font-size:14px}
.seg button.on{background:var(--bg);color:var(--fg)}
/* auth */
#auth{height:100%;overflow-y:auto}
.auth-card{max-width:380px;margin:0 auto;padding-top:9vh;display:flex;flex-direction:column;gap:14px}
.auth-card h1{font-size:44px;font-weight:800;line-height:1}
.auth-card h1 em{font-style:normal;color:var(--accent)}
/* avatar + profile */
.ava{width:64px;height:64px;border-radius:50%;color:#fff;display:grid;place-items:center;font:800 28px var(--display);flex:none;object-fit:cover;overflow:hidden}
.ava.sm{width:44px;height:44px;font-size:19px}
.ava.xs{width:36px;height:36px;font-size:16px}
.ava.lg{width:96px;height:96px;font-size:40px}
.phero{padding-block:14px 8px}
.ptop{display:flex;justify-content:space-between;align-items:center;padding-block:10px}
.ptop button{width:36px;height:36px;display:grid;place-items:center}.ptop svg{width:24px;height:24px}
.pname{display:flex;gap:14px;align-items:center}
.pname h2{font-size:24px;overflow-wrap:anywhere}
.stats{display:flex;gap:26px;margin-block:12px}
.stats button{text-align:left}
.stats b{display:block;font:800 20px var(--display);font-variant-numeric:tabular-nums}
.stats span{color:var(--mute);font-size:12px}
.pchips{display:flex;gap:8px;overflow-x:auto;padding-block:10px}
.pchips button{flex:none;border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px;background:var(--surface)}
.ptabs{display:flex;border-bottom:1px solid var(--line)}
.ptabs button{flex:1;padding:10px 0;display:grid;place-items:center;color:var(--mute);border-bottom:2px solid transparent}
.ptabs button.on{color:var(--fg);border-color:var(--fg)}.ptabs svg{width:22px;height:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:3px}
.tile{position:relative;aspect-ratio:3/4;background:var(--surface);overflow:hidden;display:block;width:100%}
.tile video{width:100%;height:100%;object-fit:cover;pointer-events:none}
.tile small{position:absolute;left:6px;bottom:4px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 4px #000}
.tile em{position:absolute;left:6px;top:6px;background:var(--accent);color:var(--on-accent);font:700 10px var(--body);padding:2px 6px;border-radius:4px;font-style:normal}
.sw6{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw6 button{height:70px;border-radius:12px;border:3px solid transparent}
.sw6 button.on{border-color:var(--fg)}
.bub{max-width:78%;padding:8px 12px;border-radius:16px;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--on-accent)}
.bub.th{align-self:flex-start;background:var(--surface)}
.thread{display:flex;flex-direction:column;gap:8px}
details{border-bottom:1px solid var(--line);padding:12px 0}summary{font-weight:700;cursor:pointer}details p{color:var(--mute);margin:8px 0 0}
.toast{position:absolute;left:50%;bottom:84px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-weight:700;font-size:13px;z-index:40;max-width:90%;text-align:center}
.brk{position:absolute;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px;text-align:center}
.prev{width:100%;max-height:46vh;border-radius:12px;background:#000;display:block}
.camwrap{position:absolute;inset:0;background:#000;color:#fff;display:flex;flex-direction:column}
#v-upload.cam{padding:0;overflow:hidden}
.camwrap video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.camwrap video.mir,.camwrap canvas.mir{transform:scaleX(-1)}
.camwrap canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.camwrap video.hid{opacity:0;pointer-events:none}
.camfx{position:absolute;left:0;right:0;bottom:180px;z-index:2;display:flex;gap:10px;overflow-x:auto;padding:0 14px;scrollbar-width:none}
.camfx::-webkit-scrollbar{display:none}
.camfx button{flex:0 0 auto;min-width:62px;padding:8px 12px;border-radius:99px;border:2px solid transparent;background:rgba(0,0,0,.45);color:#fff;font-weight:700;font-size:12px;backdrop-filter:blur(6px)}
.camfx button.on{border-color:#ff5c8a;background:rgba(255,92,138,.35)}
.camtop{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.camtime{background:#e0245e;color:#fff;border-radius:99px;padding:4px 12px;font-weight:700;font-size:14px}
.cambar{position:absolute;left:0;right:0;bottom:84px;display:flex;justify-content:space-around;align-items:center;z-index:2}
.cambtn{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;border:0;display:grid;place-items:center;font-size:12px;font-weight:700;backdrop-filter:blur(6px)}
.recbtn{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:#ff3b6b;padding:0;transition:all .15s}
.recbtn.on{border-radius:22px;width:64px;height:64px;background:#e0245e}
.cammodes{position:absolute;left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:26px;z-index:2}
.cammodes button{background:none;border:0;color:rgba(255,255,255,.65);font-weight:700;font-size:15px;padding:6px 4px}
.cammodes button.on{color:#fff;border-bottom:2px solid #fff}
.camx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:3;width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;border:0;font-size:22px;line-height:1;display:grid;place-items:center}
.camtools{position:absolute;right:10px;top:calc(env(safe-area-inset-top,0px) + 12px);z-index:3;display:flex;flex-direction:column;gap:14px}
.camtools button{background:none;border:0;color:#fff;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.7);padding:0;min-width:48px}
.camtools button span{font-size:24px;line-height:1}
.camtools button.on{color:#ff5c8a}
.camcd{position:absolute;inset:0;z-index:4;display:grid;place-items:center;font-size:120px;font-weight:800;color:#fff;background:rgba(0,0,0,.25);text-shadow:0 2px 12px rgba(0,0,0,.6)}
@keyframes edzoom{from{transform:scale(1)}to{transform:scale(1.2)}}@keyframes edshake{0%{transform:translate(0,0) scale(1.04)}25%{transform:translate(2px,-2px) scale(1.04)}50%{transform:translate(-2px,1px) scale(1.04)}75%{transform:translate(1px,2px) scale(1.04)}100%{transform:translate(0,0) scale(1.04)}}@keyframes edpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.camerr{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;z-index:1;color:#ddd}
.cvprev{height:96px;border-radius:12px;background-size:cover;background-position:center;margin-top:14px}
.lbgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lbgs button{height:54px;border-radius:10px;border:2px solid transparent;padding:0}
.lbgs button.on{border-color:var(--fg)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--mute);display:block;cursor:pointer}
.qrbox{background:#fff;padding:16px;border-radius:14px;display:grid;place-items:center;width:max-content;margin:12px auto}
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.gifts button{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700}
.gifts span{font-size:28px}
@media (prefers-reduced-motion:no-preference){.rail .liked svg{animation:pop .25s}}
@keyframes pop{50%{transform:scale(1.25)}}
</style>

<div class="app">
  <div id="auth" class="pad" hidden></div>
  <div id="shell" hidden>
    <div class="views">
      <div id="v-feed" class="view"><div class="ftabs"></div><button class="srch" data-act="opensearch" aria-label="Search"></button><button class="livebtn" data-act="lobby" aria-label="LIVE">LIVE</button><button class="snd" data-act="snd" aria-label="Sound"></button><div id="feed"></div></div>
      <div id="v-inbox" class="view pad" hidden></div>

    </div>
  </div>

    <div>
      <header class="pad"><h3 id="s2t"></h3><button class="link" data-act="close2">Close</button></header>
      <div id="s2b" class="pad"></div>

</div>
<script type="text/plain" id="appjs">
/* ===== Firebase layer: gives the app the same small "sb" interface it used with Supabase, but runs on Firebase.
   A = adapter (real Firebase in the page, or an in-memory fake in tests). ===== */
function makeSB(A){
  const PKS={likes:['post_id','user_id'],follows:['follower_id','following_id'],requests:['follower_id','following_id'],blocks:['blocker_id','blocked_id'],marks:['user_id','kind','post_id'],app_settings:['key'],profiles:['id'],user_data:['id'],wallets:['user_id']};

async function runFlush(){

  try{
    do{
      again=false;const cur=snap(),ins={},upd=[],del=[];
      for(const[k,v]of cur){const o=shadow.get(k);if(!o)(ins[v.t]=ins[v.t]||[]).push(v.r);else if(JSON.stringify(o.r)!==JSON.stringify(v.r))upd.push(v)}
      for(const[k,v]of shadow)if(!cur.has(k))del.push(v);
      for(const t of ORDER)if(ins[t]){const r=await sb.from(t).insert(ins[t]);if(r.error)throw r.error}
      for(const v of upd){const cols=UPD[v.t];if(!cols)continue;let q=sb.from(v.t).update(Object.fromEntries(cols.map(c=>[c,v.r[c]])));for(const c of pk(v.t))q=q.eq(c,v.r[c]);const r=await q;if(r.error)throw r.error}
      for(const v of del){let q=sb.from(v.t).delete();for(const c of pk(v.t))q=q.eq(c,v.r[c]);const r=await q;if(r.error)throw r.error}
      shadow=cur;
    }while(again);
  }catch(e){console.error(e);failed=true}

}

function fillSearch(){
  const q=(window._sq||'').trim().toLowerCase().replace(/^@/,''),m=me(),ok=u=>!u.banned&&!isBlk(u.id,m.id);
  const row2=u=>`<button class="li" data-act="profile" data-id="${u.id}">${avaHTML(u,'xs')}<div class="grow"><div><b>@${esc(u.name)}</b></div><div class="mute" style="font-size:12px">${fmt(nfol(u.id))} followers</div></div>${u.role!=='user'?`<span class="pill ${u.role}">${u.role==='ceo'?'CEO':u.role}</span>`:''}</button>`;
  let h='';
  if(!q){
    const tags={};S.posts.filter(vis).forEach(p=>(p.caption.match(/#[\p{L}\p{N}_]+/gu)||[]).forEach(x=>{x=x.toLowerCase();tags[x]=(tags[x]||0)+1}));
    const tl=Object.entries(tags).sort((a,b)=>b[1]-a[1]).slice(0,10);
    h+=tl.length?`<div><h3>Trending tags</h3><div class="chips" style="margin-top:8px">${tl.map(([x,n])=>`<button class="chip" data-act="tag" data-id="${esc(x)}">${esc(x)} &middot; ${n}</button>`).join('')}</div></div>`:'';
    h+=`<div><h3>Creators</h3><div class="list">${S.users.filter(ok).sort((a,b)=>nfol(b.id)-nfol(a.id)).slice(0,10).map(row2).join('')||'<p class="mute">No creators yet.</p>'}</div></div>`;
  }else{
    const vs=S.posts.filter(p=>vis(p)&&!p.priv&&p.caption.toLowerCase().includes(q));
    h+=`<div><h3>Users</h3><div class="list">${S.users.filter(u=>ok(u)&&(u.name.includes(q)||u.dname.toLowerCase().includes(q))).map(row2).join('')||'<p class="mute">No users found.</p>'}</div></div>`;
    h+=`<div><h3>Videos</h3><div class="list">${vs.map(p=>postRow(p)).join('')||'<p class="mute">No videos found.</p>'}</div></div>`;
  }
  $('#sres').innerHTML=h;
}

function shrink(f,w,hh,q,done){
  if(!f||!String(f.type).startsWith('image/'))return toast('Choose an image.');
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas');c.width=w;c.height=hh;const x=c.getContext('2d'),k=Math.max(w/im.width,hh/im.height),sw=w/k,sh=hh/k;
    x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,0,0,w,hh);done(c.toDataURL('image/jpeg',q))};im.onerror=()=>toast('Could not read that image.');im.src=r.result};r.readAsDataURL(f)
}

function readAvatar(f){if(!f||!f.type.startsWith('image/'))return toast('Choose an image.');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,160,160);pAva=c.toDataURL('image/jpeg',.8);const p=$('#avprev');if(p)p.innerHTML=`<img class="ava lg" src="${pAva}" alt="">`};im.src=r.result};r.readAsDataURL(f)}

/* ===== LIVE voice rooms: host, guests on seats, gifts, and host-vs-host matches =====
   Voice runs over WebRTC. The host's phone mixes every voice and sends the mix to each listener.
   Signals (who is live, chat, gifts, the call setup) travel through Net below. Today Net uses a
   BroadcastChannel (browser tabs on one device). When Firebase is connected, only Net changes. */
const ICE_SERVERS=[{urls:'stun:stun.l.google.com:19302'}]; /* add TURN servers here: some mobile networks need them */
const MAXSEATS=8,MATCH_MINS=[3,5,10];
const Net=(()=>{const cbs=[];let bc=null;const ov=window.__LIVE_NET;
  try{if(ov)ov.onmessage=m=>cbs.forEach(f=>f(m));else{bc=new BroadcastChannel('hadi-live');bc.onmessage=e=>cbs.forEach(f=>f(e.data))}}catch(e){}
  return{on:f=>cbs.push(f),watch:()=>{try{ov&&ov.watch&&ov.watch()}catch(e){}},room:r=>{try{ov&&ov.room&&ov.room(r)}catch(e){}},send(m){try{if(ov)ov.send(m);else if(bc)bc.postMessage(m)}catch(e){}}}})();
const AC=window.AudioContext||window.webkitAudioContext;
const LOBBY=new Map();let LV=null;
const lvIs=r=>LV&&LV.role===r;
const lvSeated=id=>LV.guests.some(g=>g.id===id);
const lvSend=(t,o={})=>Net.send(Object.assign({t,room:LV?LV.room:undefined,from:{id:me().id,name:me().name},mid:uid()},o));

/* ---------- audio mixer (host only) ---------- */
function makeMixer(){
  const ctx=new AC(),all=ctx.createMediaStreamDestination(),minus=new Map(),src=new Map(),mon=ctx.createGain();mon.connect(ctx.destination);
  return{ctx,all,
    add(id,stream){if(src.has(id))this.drop(id);const s=ctx.createMediaStreamSource(stream),g=ctx.createGain(),an=ctx.createAnalyser();an.fftSize=512;
      s.connect(g);g.connect(an);g.connect(all);minus.forEach((d,pid)=>{if(pid!==id)g.connect(d)});if(id!=='host')g.connect(mon);src.set(id,{s,g,an,muted:false})},
    dest(id){if(!minus.has(id)){const d=ctx.createMediaStreamDestination();src.forEach((o,sid)=>{if(sid!==id)o.g.connect(d)});minus.set(id,d)}return minus.get(id)},
    mute(id,on){const o=src.get(id);if(o){o.g.gain.value=on?0:1;o.muted=on}},
    drop(id){const o=src.get(id);if(o){try{o.g.disconnect();o.s.disconnect()}catch(e){}src.delete(id)}},
    level(id){const o=src.get(id);if(!o||o.muted)return 0;const a=new Uint8Array(o.an.fftSize);o.an.getByteTimeDomainData(a);let m=0;for(const v of a)m=Math.max(m,Math.abs(v-128));return m/128},
    has:id=>src.has(id),close(){try{ctx.close()}catch(e){}}};
}
const keepAlive=(p,stream)=>{try{const a=new Audio();a.muted=true;a.srcObject=stream;a.play().catch(()=>{});p.audio=a}catch(e){}};
const outTrack=p=>{const m=LV.mixer;const d=p.role==='opp'?m.dest('opp'):lvSeated(p.id)?m.dest(p.id):m.all;return d.stream.getAudioTracks()[0]};
const getMic=()=>navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});

/* ---------- starting, joining, leaving ---------- */
function lvOpen(){

function hostStart(title){
  if(liveBanMs()>0)return toast(liveBanMsg());
  const m=me();if(st(m).restricted)return toast('Turn off restricted mode to use LIVE.');
  if(LV)return;
  Net.watch&&Net.watch();Net.room&&Net.room(m.id);
  LV={role:'host',room:m.id,title:(title||'').trim().slice(0,50)||'@'+m.name+' is live',hostInfo:{id:m.id,name:m.name},peers:new Map(),viewers:new Map(),guests:[],reqs:[],chat:[],lb:new Map(),fx:[],seen:new Set(),match:null,speaking:[],micOn:true,voiceOk:false,mixer:null,mic:null,timers:[],inv:null,lastChat:{},t0:Date.now(),peak:0,kicked:new Set()};
  lvOpen();
  (async()=>{
    try{if(!AC||!window.RTCPeerConnection)throw 0;LV.mixer=makeMixer();LV.mic=await getMic();LV.mixer.add('host',LV.mic);LV.voiceOk=true}catch(e){LV.voiceOk=false;if(LV.mixer){LV.mixer.close();LV.mixer=null}}
    sysChat(LV.voiceOk?'You are live. Talk now.':'You are live without voice. Allow the microphone in a browser that supports it to talk.');pushState();
  })();
  const announce=()=>Net.send({t:'live',room:LV.room,title:LV.title,host:LV.hostInfo,n:LV.viewers.size,match:LV.match&&LV.match.state==='live'?LV.match.vs.name:null,seats:LV.guests.length});
  announce();
  LV.timers.push(setInterval(announce,3000),setInterval(hostTick,250),setInterval(()=>pushState(true),1500));
}
function hostTick(){
  if(!LV||LV.role!=='host')return;
  const now=Date.now();
  for(const[id,v]of LV.viewers)if(now-v.ts>16000)dropViewer(id,true);
  if(LV.mixer){const ids=['host',...LV.guests.map(g=>g.id)];if(LV.match)ids.push('opp');
    const sp=ids.filter(id=>LV.mixer.level(id)>0.05).map(id=>id==='opp'?'opp':id);
    if(sp.join()!==LV.speaking.join()){LV.speaking=sp;drawRoom()}}
  if(LV.match&&LV.match.state==='live'){if(now>=LV.match.endsAt)finishMatch();else drawMatch()}
}
function joinLive(room){
  if(liveBanMs()>0)return toast(liveBanMsg());
  const m=me();if(st(m).restricted)return toast('Turn off restricted mode to use LIVE.');
  const r=LOBBY.get(room);if(!r)return toast('This LIVE has ended.');if(LV)return;
  Net.room&&Net.room(room);

  stack.length=0;$('#page').hidden=true;lvOpen();drawRoom();
  lvSend('join');

async function viewerConnect(){
  try{
    if(!window.RTCPeerConnection)throw 0;
    const pc=new RTCPeerConnection({iceServers:ICE_SERVERS});LV.vpc=pc;pc.addTransceiver('audio',{direction:'sendrecv'});
    pc.ontrack=e=>{const a=LV.audioEl||(LV.audioEl=new Audio());a.autoplay=true;a.srcObject=e.streams[0]||new MediaStream([e.track]);a.play().catch(()=>{});LV.voiceOk=true;drawRoom()};
    pc.onicecandidate=e=>{if(e.candidate)lvSend('rtc',{to:LV.room,kind:'ice',data:e.candidate.toJSON()})};
    const off=await pc.createOffer();await pc.setLocalDescription(off);lvSend('rtc',{to:LV.room,kind:'offer',role:'listener',data:pc.localDescription});

function lvLeave(silent){

  try{if(l.role==='host'){Net.send({t:'end',room:l.room,from:{id:me().id,name:me().name},mid:uid()});l.peers.forEach(p=>{try{p.pc.close()}catch(e){}});if(l.match)Net.send({t:'mstop',to:l.match.vs.room,from:{id:me().id,name:me().name},mid:uid()});l.mixer&&l.mixer.close()}
    else{Net.send({t:'leave',room:l.room,from:{id:me().id,name:me().name},mid:uid()});l.vpc&&l.vpc.close();if(l.audioEl)l.audioEl.srcObject=null}}catch(e){}

    try{const sec=Math.max(0,Math.round((Date.now()-(l.t0||Date.now()))/1000)),coins=[...l.lb.values()].reduce((a,x)=>a+x.c,0),givers=l.lb.size;
      sheet2('LIVE summary',`<div class="stack"><div class="card"><b>Time</b><div>${Math.floor(sec/60)} min ${sec%60} sec</div></div><div class="card"><b>Most people watching</b><div>${l.peak||0}</div></div><div class="card"><b>Gifts</b><div>${coins} coins from ${givers} ${givers===1?'person':'people'}</div></div></div>`)}catch(_){}}

}

/* ---------- host state, chat, gifts ---------- */
function matchView(){const x=LV.match;return{vs:x.vs,mine:x.mine,theirs:x.theirs,endsAt:x.endsAt,state:x.state,result:x.result||null}}
function hostState(){return{t:'state',room:LV.room,from:LV.hostInfo,mid:uid(),title:LV.title,guests:LV.guests,reqs:LV.reqs,n:LV.viewers.size,chat:LV.chat.slice(-25),top:[...LV.lb.values()].sort((a,b)=>b.c-a.c).slice(0,3),fx:LV.fx.slice(-6),match:LV.match?matchView():null,speaking:LV.speaking,hostMuted:!LV.micOn,voice:LV.voiceOk,ended:false}}
let pushT=0;
function pushState(now){if(!lvIs('host'))return;if(now){Net.send(hostState());return}clearTimeout(pushT);pushT=setTimeout(()=>{if(lvIs('host')){Net.send(hostState());drawRoom()}},90)}
function sysChat(text){LV.chat.push({id:uid(),kind:'sys',text,ts:Date.now()});if(LV.chat.length>60)LV.chat.shift();drawRoom()}
function creditOnce(m,g){
  if(LV.seen.has('c'+m.mid))return;LV.seen.add('c'+m.mid);
  toast(g.emoji+' '+g.name+' from @'+m.from.name);setTimeout(()=>{try{load().then(()=>renderTabs())}catch(e){}},900);
}
function hostGift(m){
  if(LV.seen.has(m.mid))return;LV.seen.add(m.mid);
  const g=S.gifts.find(x=>x.id===m.gid);if(!g||!m.to)return;
  if(m.to.id!==LV.hostInfo.id&&!lvSeated(m.to.id))return;
  const e=LV.lb.get(m.from.id)||{name:m.from.name,c:0};e.c+=g.coins;LV.lb.set(m.from.id,e);
  LV.chat.push({id:uid(),kind:'gift',name:m.from.name,text:g.emoji+' '+g.name+' to @'+m.to.name,ts:Date.now()});
  {const last=LV.fx[LV.fx.length-1],now=Date.now();
    if(last&&last.emoji===g.emoji&&last.from===m.from.name&&last.to===m.to.name&&now-(last.t||0)<6000){last.n=(last.n||1)+1;last.id=m.mid;last.t=now;last.coins+=g.coins}
    else LV.fx.push({id:m.mid,emoji:g.emoji,name:g.name,from:m.from.name,to:m.to.name,coins:g.coins,n:1,t:now})}
  if(LV.match&&LV.match.state==='live'&&Date.now()<LV.match.endsAt){LV.match.mine+=g.coins;sendScore()}
  if(m.to.id===me().id)creditOnce(m,g);
  pushState();
}
async function sendGift(gid,to){
  const g=S.gifts.find(x=>x.id===gid),u=me();if(!g||!LV||lvIs('host')||LV.sending)return;
  if(u.coins<g.coins){toast('Not enough coins.');return}
  LV.sending=true;const ok=await cloud('live_gift',{to:to.id,gid});if(LV)LV.sending=false;if(!ok||!LV)return;
  lvSend('gift',{gid,to});$('#lvsheet').hidden=true;
  {const now=Date.now(),c=LV.myCombo;LV.myCombo=c&&c.gid===gid&&now-c.t<6000?{gid,t:now,n:c.n+1}:{gid,t:now,n:1};
    lvFx(g.emoji,'You sent '+g.name+(LV.myCombo.n>1?' x'+LV.myCombo.n:''))}
}
function dropViewer(id,silent){
  if(!lvIs('host'))return;
  LV.viewers.delete(id);LV.reqs=LV.reqs.filter(r=>r.id!==id);
  if(lvSeated(id))removeGuest(id,true);
  const p=LV.peers.get(id);if(p&&p.role!=='opp'){try{p.pc.close()}catch(e){}LV.peers.delete(id)}
  if(!silent)pushState();else pushState();
}
function removeGuest(id,quiet){
  LV.guests=LV.guests.filter(g=>g.id!==id);LV.mixer&&LV.mixer.drop(id);
  const p=LV.peers.get(id);if(p&&p.pc&&p.pc.connectionState!=='closed'){try{p.pc.getTransceivers()[0].sender.replaceTrack(LV.mixer?LV.mixer.all.stream.getAudioTracks()[0]:null)}catch(e){}}
  if(!quiet)pushState();
}
function acceptGuest(id){
  const r=LV.reqs.find(x=>x.id===id);LV.reqs=LV.reqs.filter(x=>x.id!==id);
  if(!r||LV.guests.length>=MAXSEATS||lvSeated(id)){pushState();return}
  LV.guests.push({id,name:r.name,muted:false});
  const p=LV.peers.get(id);
  if(LV.mixer&&p&&p.stream){LV.mixer.add(id,p.stream);try{p.pc.getTransceivers()[0].sender.replaceTrack(LV.mixer.dest(id).stream.getAudioTracks()[0])}catch(e){}}
  sysChat('@'+r.name+' joined the seats.');pushState();
}

/* ---------- match (host vs host) ---------- */
function sendScore(){if(!LV.match)return;Net.send({t:'mscore',to:LV.match.vs.room,from:LV.hostInfo,mid:uid(),id:LV.match.id,score:LV.match.mine})}
function beginMatch(id,vsRoom,vsName,endsAt){
  LV.match={id,vs:{room:vsRoom,name:vsName},mine:0,theirs:0,endsAt,state:'live'};sysChat('Match with @'+vsName+' started!');pushState();
}
async function startOpp(oppId){
  if(!LV.mixer)return;
  try{
    const pc=new RTCPeerConnection({iceServers:ICE_SERVERS}),p={pc,id:oppId,role:'opp',ice:[]};LV.peers.set(oppId,p);
    pc.addTransceiver('audio',{direction:'sendrecv'});await pc.getTransceivers()[0].sender.replaceTrack(outTrack(p));
    pc.ontrack=e=>{p.stream=e.streams[0]||new MediaStream([e.track]);keepAlive(p,p.stream);LV.mixer.add('opp',p.stream)};
    pc.onicecandidate=e=>{if(e.candidate)lvSend('rtc',{to:oppId,kind:'ice',data:e.candidate.toJSON()})};
    const off=await pc.createOffer();await pc.setLocalDescription(off);lvSend('rtc',{to:oppId,kind:'offer',role:'opp',data:pc.localDescription});
  }catch(e){console.error(e)}
}
function finishMatch(){
  const x=LV.match;if(!x||x.state!=='live')return;x.state='ending';sendScore();
  setTimeout(()=>{if(!LV||!LV.match||LV.match.id!==x.id)return;x.state='done';x.result=x.mine>x.theirs?'win':x.mine<x.theirs?'lose':'draw';
    sysChat(x.result==='draw'?'Match ended in a draw.':x.result==='win'?'You won the match!':'@'+x.vs.name+' won the match.');pushState();
    LV.timers.push(setTimeout(()=>{if(LV&&LV.match&&LV.match.id===x.id)stopMatch(true)},25000))},1500);
}
function stopMatch(auto){
  if(!lvIs('host')||!LV.match)return;
  Net.send({t:'mstop',to:LV.match.vs.room,from:LV.hostInfo,mid:uid()});
  const p=LV.peers.get(LV.match.vs.room);if(p){try{p.pc.close()}catch(e){}LV.peers.delete(LV.match.vs.room)}
  LV.mixer&&LV.mixer.drop('opp');LV.match=null;pushState();
}

/* ---------- incoming messages ---------- */
Net.on(async m=>{
  if(!m||!m.t||!me())return;
  if(m.from&&m.from.id===me().id)return;
  if(m.t==='live'){LOBBY.set(m.room,Object.assign({},m,{seen:Date.now()}));lobbyRefresh();return}
  if(!LV)return;
  /* messages addressed to one person */
  if(m.to&&typeof m.to==='string'&&m.to===me().id){
    if(m.t==='minvite'&&lvIs('host')&&!LV.match){LV.inv=m;drawRoom();lvSheet('Match invite',`<p><b>@${esc(m.from.name)}</b> wants a ${m.mins} minute match. Both of you talk together and the room with more gifts wins.</p><div class="acts" style="justify-content:stretch"><button class="btn" data-act="lvinvyes">Accept</button><button class="btn ghost" data-act="lvinvno">Decline</button></div>`);return}
    if(m.t==='maccept'&&lvIs('host')&&LV.pendingInv===m.from.id){const id=uid(),endsAt=Date.now()+(LV.pendingMins||5)*60000;LV.pendingInv=null;beginMatch(id,m.from.id,m.from.name,endsAt);
      Net.send({t:'mstart',to:m.from.id,from:LV.hostInfo,mid:uid(),id,endsAt,room:LV.room});startOpp(m.from.id);return}
    if(m.t==='mdecline'&&lvIs('host')){LV.pendingInv=null;toast('@'+m.from.name+' declined the match.');return}
    if(m.t==='mstart'&&lvIs('host')){beginMatch(m.id,m.from.id,m.from.name,m.endsAt);return}
    if(m.t==='mscore'&&lvIs('host')&&LV.match&&LV.match.id===m.id){LV.match.theirs=m.score;pushState();return}
    if(m.t==='mstop'&&lvIs('host')&&LV.match){const p=LV.peers.get(LV.match.vs.room);if(p){try{p.pc.close()}catch(e){}LV.peers.delete(LV.match.vs.room)}LV.mixer&&LV.mixer.drop('opp');LV.match=null;toast('The match ended.');pushState();return}
    if(m.t==='kick'&&!lvIs('host')){toast('The host removed you from this LIVE.');lvLeave(true);return}
    if(m.t==='rtc'){await onRtc(m);return}
  }
  if(m.room!==LV.room)return;
  if(lvIs('host')){
    if(LV.kicked.has(m.from.id)){if(m.t==='join'||m.t==='hb')Net.send({t:'kick',to:m.from.id,room:LV.room,from:LV.hostInfo,mid:uid()});return}
    if(m.t==='join'){LV.viewers.set(m.from.id,{name:m.from.name,ts:Date.now()});LV.peak=Math.max(LV.peak,LV.viewers.size);sysChat('@'+m.from.name+' joined');pushState();Net.send(hostState())}
    else if(m.t==='hb'){const v=LV.viewers.get(m.from.id);if(v)v.ts=Date.now();else LV.viewers.set(m.from.id,{name:m.from.name,ts:Date.now()})}
    else if(m.t==='leave')dropViewer(m.from.id);
    else if(m.t==='chat'){if(isBad(m.text))return;const now=Date.now();if(now-(LV.lastChat[m.from.id]||0)<700)return;LV.lastChat[m.from.id]=now;LV.chat.push({id:m.mid,kind:'chat',name:m.from.name,text:String(m.text||'').slice(0,100),ts:now});if(LV.chat.length>60)LV.chat.shift();pushState()}
    else if(m.t==='gift')hostGift(m);
    else if(m.t==='req'){if(!lvSeated(m.from.id)&&!LV.reqs.some(r=>r.id===m.from.id)&&LV.guests.length<MAXSEATS&&LV.viewers.has(m.from.id)){LV.reqs.push({id:m.from.id,name:m.from.name});pushState()}}
    else if(m.t==='leaveseat'&&lvSeated(m.from.id)){removeGuest(m.from.id)}
  }else{
    if(m.t==='state')onState(m);
    else if(m.t==='end'){toast('The LIVE ended.');lvLeave(true)}
    else if(m.t==='gift'&&m.to&&m.to.id===me().id){const g=S.gifts.find(x=>x.id===m.gid);if(g)creditOnce(m,g)}
  }
});
async function onRtc(m){
  try{
    if(lvIs('host')&&m.kind==='offer'){
      const id=m.from.id,role=m.role==='opp'?'opp':'listener';
      const old=LV.peers.get(id);if(old){try{old.pc.close()}catch(e){}}
      const pc=new RTCPeerConnection({iceServers:ICE_SERVERS}),p={pc,id,role,name:m.from.name,ice:[]};LV.peers.set(id,p);
      pc.onicecandidate=e=>{if(e.candidate)lvSend('rtc',{to:id,kind:'ice',data:e.candidate.toJSON()})};
      pc.ontrack=e=>{p.stream=e.streams[0]||new MediaStream([e.track]);keepAlive(p,p.stream);if(LV.mixer){if(role==='opp')LV.mixer.add('opp',p.stream);else if(lvSeated(id)&&!LV.mixer.has(id))LV.mixer.add(id,p.stream)}};
      await pc.setRemoteDescription(m.data);
      const tr=pc.getTransceivers()[0];tr.direction='sendrecv';if(LV.mixer)await tr.sender.replaceTrack(outTrack(p));
      const ans=await pc.createAnswer();await pc.setLocalDescription(ans);lvSend('rtc',{to:id,kind:'answer',data:pc.localDescription});
      p.ice.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));p.ice=[];
    }else if(m.kind==='answer'){
      const pc=lvIs('host')?(LV.peers.get(m.from.id)||{}).pc:LV.vpc;if(pc)await pc.setRemoteDescription(m.data);
      const p=lvIs('host')?LV.peers.get(m.from.id):null;if(p){p.ice.forEach(c=>pc.addIceCandidate(c).catch(()=>{}));p.ice=[]}
    }else if(m.kind==='ice'){
      if(lvIs('host')){const p=LV.peers.get(m.from.id);if(!p)return;if(p.pc.remoteDescription)p.pc.addIceCandidate(m.data).catch(()=>{});else p.ice.push(m.data)}
      else if(LV.vpc){if(LV.vpc.remoteDescription)LV.vpc.addIceCandidate(m.data).catch(()=>{});else(LV.pend=LV.pend||[]).push(m.data)}
    }
    if(!lvIs('host')&&LV.vpc&&LV.vpc.remoteDescription&&LV.pend){LV.pend.forEach(c=>LV.vpc.addIceCandidate(c).catch(()=>{}));LV.pend=null}
  }catch(e){console.error('rtc',e)}
}
async function onState(m){
  LV.st=m;LV.lastState=Date.now();LV.title=m.title;
  const mine=m.guests.some(g=>g.id===me().id);
  if(mine&&!LV.seated){LV.seated=true;
    try{LV.mic=await getMic();if(LV.vpc)await LV.vpc.getTransceivers()[0].sender.replaceTrack(LV.mic.getAudioTracks()[0]);toast('You are on the seats. Your mic is on.')}
    catch(e){toast('Microphone is not available.');LV.seated=false;lvSend('leaveseat')}}
  if(!mine&&LV.seated){LV.seated=false;try{if(LV.vpc)LV.vpc.getTransceivers()[0].sender.replaceTrack(null)}catch(e){}if(LV.mic){LV.mic.getTracks().forEach(t=>t.stop());LV.mic=null}toast('You left the seats.')}
  const me_g=m.guests.find(g=>g.id===me().id);if(LV.mic)LV.mic.getAudioTracks().forEach(t=>t.enabled=!(me_g&&me_g.muted)&&!LV.selfMuted);
  (m.fx||[]).forEach(f=>{if(!LV.fxSeen.has(f.id)){LV.fxSeen.add(f.id);if(f.from!==me().name)lvFx(f.emoji,f.from+' sent '+f.name+(f.n>1?' x'+f.n:''))}});
  drawRoom();
}

/* ---------- drawing ---------- */
const lvAva=(name,cls='')=>`<div class="ava ${cls}" style="background:${avaBg(name)}">${esc((name||'?')[0].toUpperCase())}</div>`;
function lvFx(emoji,text){
  const f=$('#lvfx');if(!f)return;const d=document.createElement('div');d.className='lv-fx';d.innerHTML=`<span>${emoji}</span><b>${esc(text)}</b>`;f.appendChild(d);setTimeout(()=>d.remove(),2600);
}
function drawMatch(){
  const el=$('#lvmatch');if(!el||!LV)return;const s=lvIs('host')?hostState():LV.st;
  if(!s||!s.match){el.innerHTML='';return}
  const x=s.match,left=Math.max(0,Math.ceil((x.endsAt-Date.now())/1000)),mm=String(Math.floor(left/60)).padStart(1,'0')+':'+String(left%60).padStart(2,'0'),tot=Math.max(1,x.mine+x.theirs),pct=x.mine+x.theirs?Math.round(x.mine/tot*100):50;
  el.innerHTML=`<div class="lv-match pad"><div class="lv-ms"><div><b>${esc(s.from.name)}</b><span>${x.mine}</span></div><div class="lv-vs">${x.state==='done'?(x.result==='win'?'WIN':x.result==='lose'?'LOSE':'DRAW'):x.state==='ending'?'...':mm}</div><div><b>${esc(x.vs.name)}</b><span>${x.theirs}</span></div></div><div class="lv-bar2"><i style="width:${pct}%"></i></div></div>`;
}
function drawRoom(){
  if(!LV||!$('#live'))return;
  const host=lvIs('host'),s=host?hostState():LV.st,meId=me().id;
  $('#lvhead').innerHTML=`${lvAva(LV.hostInfo.name,'xs')}<div class="lv-t"><b>@${esc(LV.hostInfo.name)}</b><small>${esc(LV.title)}</small></div><span class="pill ceo">LIVE</span><span class="lv-n">${s?s.n:0} watching</span>`;
  drawMatch();
  if(!s){$('#lvseats').innerHTML='<p class="mute">Connecting...</p>';return}
  const sp=new Set(s.speaking||[]),seats=[];
  seats.push(`<button class="seat host" ${host?'':''} type="button"><div class="ring ${sp.has(s.from.id)?'on':''}">${lvAva(s.from.name,'sm')}</div><b>${esc(s.from.name)}</b><small>${s.hostMuted?'Muted':'Host'}</small></button>`);
  s.guests.forEach(g=>seats.push(`<button class="seat" type="button" data-act="${host?'lvguest':'lvnone'}" data-id="${g.id}"><div class="ring ${sp.has(g.id)?'on':''}">${lvAva(g.name,'sm')}</div><b>${esc(g.name)}</b><small>${g.muted?'Muted':'Guest'}</small></button>`));
  for(let i=s.guests.length;i<Math.min(MAXSEATS,s.guests.length+2);i++)seats.push(`<button class="seat empty" type="button" data-act="${host?'lvreqs':'lvreq'}" aria-label="${host?'Requests':'Request a seat'}"><div class="ring"><div class="ava sm plus">+</div></div><b>${host&&s.reqs.length?s.reqs.length+' waiting':'Seat'}</b></button>`);
  $('#lvseats').innerHTML=`<div class="seats">${seats.join('')}</div>${s.top&&s.top.length?`<div class="lv-top3">${s.top.map((x,i)=>`<span>${['&#129351;','&#129352;','&#129353;'][i]} ${esc(x.name)} <b>${x.c}</b></span>`).join('')}</div>`:''}${!s.voice&&!host?'<p class="note">Voice is off here. Open the hosted app in Chrome or Safari to hear the room.</p>':''}${host&&!LV.voiceOk?'<p class="note">Your microphone is off. Talk by allowing the microphone in the hosted app.</p>':''}`;
  const ch=$('#lvchat'),atEnd=ch.scrollTop+ch.clientHeight>=ch.scrollHeight-40;
  ch.innerHTML=s.chat.map(c=>c.kind==='sys'?`<div class="lv-sys">${esc(c.text)}</div>`:c.kind==='gift'?`<div class="lv-gl"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`:`<div class="lv-c"><b>${esc(c.name)}</b> ${esc(c.text)}</div>`).join('');
  if(atEnd)ch.scrollTop=ch.scrollHeight;
  const seated=!host&&s.guests.some(g=>g.id===meId),b=[];
  if(host){b.push(`<button type="button" class="lv-b ${LV.micOn?'':'off'}" data-act="lvmic">${LV.micOn?'Mic on':'Mic off'}</button>`);
    b.push(`<button type="button" class="lv-b" data-act="lvreqs">Seats${s.reqs.length?' ('+s.reqs.length+')':''}</button>`);
    b.push(s.match?`<button type="button" class="lv-b off" data-act="lvstopm">End match</button>`:`<button type="button" class="lv-b" data-act="lvmatch">Match</button>`);
    b.push(`<button type="button" class="lv-b" data-act="lvviewers">Viewers</button>`);
    b.push(`<button type="button" class="lv-b" data-act="lvshare">Share</button>`);
    b.push(`<button type="button" class="lv-b off" data-act="lvend">End</button>`)}
  else{if(seated)b.push(`<button type="button" class="lv-b ${LV.selfMuted?'off':''}" data-act="lvself">${LV.selfMuted?'Mic off':'Mic on'}</button><button type="button" class="lv-b" data-act="lvleaveseat">Leave seat</button>`);
    else b.push(`<button type="button" class="lv-b" data-act="lvreq">Join seats</button>`);
    b.push(`<button type="button" class="lv-b" data-act="lvshare">Share</button>`);
    b.push(`<button type="button" class="lv-b gift" data-act="lvgift">Gift</button>`)}
  const bb=$('#lvbtns');if(bb.dataset.k!==b.join('')){bb.dataset.k=b.join('');bb.innerHTML=b.join('')}
  $('#lvtext').hidden=host;
}

      if(!(await Ms.isSupported()))throw new Error('Notifications are not supported on this browser. On iPhone, add the app to the Home screen first.');
      if(await Notification.requestPermission()!=='granted')throw new Error('Notifications are blocked. Allow them in the browser settings.');
      const reg=await navigator.serviceWorker.ready;
      const token=await Ms.getToken(Ms.getMessaging(app),{vapidKey:vapid,serviceWorkerRegistration:reg});
      if(!token)throw new Error('Could not get a notification token.');
      await Fs.setDoc(R('push_tokens/'+auth.currentUser.uid),{tokens:Fs.arrayUnion(token),updated_at:new Date().toISOString()},{merge:true});
      return true;
    },
    async signUp(e,p){const c=await Au.createUserWithEmailAndPassword(auth,e,p);return{id:c.user.uid,email:c.user.email}},
    async signIn(e,p){const c=await Au.signInWithEmailAndPassword(auth,e,p);return{id:c.user.uid,email:c.user.email}},
    async google(){const pr=new Au.GoogleAuthProvider();pr.setCustomParameters({prompt:'select_account'});const c=await Au.signInWithPopup(auth,pr);return{id:c.user.uid,email:c.user.email,verified:!!c.user.emailVerified}},
    sendVerify:()=>Au.sendEmailVerification(auth.currentUser),
    resetPassword:e=>Au.sendPasswordResetEmail(auth,e),
    signOut:()=>Au.signOut(auth),
    updatePassword:p=>Au.updatePassword(auth.currentUser,p),
    deleteAuthUser:()=>Au.deleteUser(auth.currentUser),
    async get(path){const s=await Fs.getDoc(R(path));return s.exists()?Object.assign({id:s.id},s.data()):null},
    async commit(ops){const b=Fs.writeBatch(db);ops.forEach(o=>{const r=R(o.path);if(o.op==='set')b.set(r,fix(o.data));else if(o.op==='update')b.update(r,fix(o.data));else b.delete(r)});await b.commit()},
    listen(coll,wheres,order,limit,cb,err){
      const c=[Fs.collection(db,coll),...wheres.map(w=>Fs.where(...w))];
      if(order)c.push(Fs.orderBy(order[0],order[1]?'asc':'desc'));if(limit)c.push(Fs.limit(limit));
      return Fs.onSnapshot(Fs.query(...c),s=>cb(s.docs.map(d=>Object.assign({id:d.id},d.data()))),err);
    },
    async downloadUrl(path){return St.getDownloadURL(St.ref(store,path))},
    upload(path,file,type,onP){return new Promise((res,rej)=>{
      const task=St.uploadBytesResumable(St.ref(store,path),file,{contentType:type});let t;
      const arm=()=>{clearTimeout(t);t=setTimeout(()=>{try{task.cancel()}catch(_){}rej(new Error('stalled: no data sent for 40s. Check internet, and that Firebase Storage is created and rules are deployed.'))},40000)};arm();
      task.on('state_changed',s=>{arm();if(onP)onP(s.bytesTransferred/Math.max(1,s.totalBytes))},e=>{clearTimeout(t);rej(new Error((e&&e.code?e.code+': ':'')+(e&&e.message||e)))},()=>{clearTimeout(t);res()})})},
    async remove(paths){await Promise.all(paths.map(p=>St.deleteObject(St.ref(store,p)).catch(()=>{})))},
    url:path=>'https://firebasestorage.googleapis.com/v0/b/'+firebaseConfig.storageBucket+'/o/'+encodeURIComponent(path)+'?alt=media',
    async call(name,args){const r=await Fn.httpsCallable(fns,name)(args);return r.data}
  };
}

/* LIVE messages over Firebase Realtime Database.
   live/lobby/{hostId}: who is live now. live/bus/{room}: everything said inside one room. live/inbox/{userId}: private messages (audio connection setup, match invites). */
function makeLiveNet(R,getUid){
  const net={onmessage:null};let lobbyOn=false,watched=null,busUn=null,inboxUn=null,od=false;
  const fixState=m=>{if(m&&m.t==='state'){['guests','reqs','chat','top','fx','speaking'].forEach(k=>{if(!Array.isArray(m[k]))m[k]=m[k]&&typeof m[k]==='object'?Object.values(m[k]):[]});if(m.match===undefined)m.match=null}return m};
  const deliver=m=>{try{if(net.onmessage&&m)net.onmessage(fixState(m))}catch(e){console.error(e)}};
  const sub=(path,rm)=>{const start=R.newKey(path);return R.onKeys(path,start,(v,k)=>{if(v)deliver(v);if(rm)R.remove(path+'/'+k)})};
  net.watch=()=>{const u=getUid();if(!u)return;
    if(!lobbyOn){lobbyOn=true;R.onChildren('live/lobby',v=>deliver(v))}
    if(watched!==u){if(inboxUn)inboxUn();watched=u;inboxUn=sub('live/inbox/'+u,true)}};
  net.room=r=>{if(busUn){busUn();busUn=null}if(r)busUn=sub('live/bus/'+r,false)};
  net.send=raw=>{
    const u=getUid();if(!u)return;
    const m=JSON.parse(JSON.stringify(raw));   /* plain data only; Firebase refuses undefined */
    if(m.t==='live'){R.set('live/lobby/'+m.from.id,m);if(!od){od=true;R.onDisconnectRemove('live/lobby/'+m.from.id)}return}
    if(m.t==='end')R.remove('live/lobby/'+m.from.id);
    if(typeof m.to==='string'&&m.to){const p='live/inbox/'+m.to,k=R.push(p,m);setTimeout(()=>R.remove(p+'/'+k),20000);return}
    if(m.room){const p='live/bus/'+m.room,k=R.push(p,m);setTimeout(()=>R.remove(p+'/'+k),15000)}
  };
  return net;
}

if(!window.FB_A){try{window.FB_A=await makeFirebaseAdapter()}catch(e){console.error(e)}}
if(window.FB_A&&window.FB_A.liveR&&!window.__LIVE_NET)window.__LIVE_NET=makeLiveNet(window.FB_A.liveR,()=>{const u=window.FB_A.user();return u&&u.id});
